    <!-- Arkusz z przodu (lekko przesunięty w lewo i w dół, z czystym białym tłem, aby zasłonić tylny arkusz) -->
    <path d="M 360,410 L 560,410 A 30,30 0 0 1 590,440 L 590,670 A 30,30 0 0 1 560,700 L 360,700 A 30,30 0 0 1 330,670 L 330,440 A 30,30 0 0 1 360,410 Z" fill="#ffffff" />
