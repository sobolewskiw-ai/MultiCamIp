<svg xmlns="http://w3.org" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Tło identyczne jak w ukryj.svg -->
  <circle cx="500" cy="500" r="435" fill="#ffffff" />
  
  <!-- Ikona kopiowania (dwa nakładające się dokumenty) -->
  <g fill="none" stroke="#0074d9" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arkusz z tyłu / pod spodem -->
